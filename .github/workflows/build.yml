name: Build Theos Tweak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ghostscript libiberty-dev libffi-dev libssl-dev pkg-config clang-14 lld-14

    - name: Setup Theos Environment
      run: |
        # Giải mã tập lệnh cài đặt Theos tự động từ mã Base64 sạch để tránh lỗi đường dẫn
        echo "YmFzaCAtYyAiJChjdXJsIC1mc1NMIGh0dHBzOi8vcmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbS90aGVvcy90aGVvcy9tYXN0ZXIvYmluL2luc3RhbGwtdGhlb3MpIg==" | base64 -d | bash
        echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        # Giải mã lệnh clone bộ SDK iOS từ mã Base64
        echo "Z2l0IGNsb25lIC0tcXVpZXQgLS1kZXB0aD0xIGh0dHBzOi8vZ2l0aHViLmNvbS90aGVvcy9zZGtzLmdpdCAvaG9tZS9ydW5uZXIvdGhlb3Mvc2Rrcw==" | base64 -d | bash

    - name: Compile Tweak
      run: |
        export THEOS=/home/runner/theos
        make package FINALPACKAGE=1

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TimeMarkGPSTweak
        path: |
          .theos/obj/*.dylib
          packages/*.deb
